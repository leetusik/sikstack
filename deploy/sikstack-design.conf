# sikstack-design.conf — d-<build>.sikstack.com, the design builds' own hosts.
#
# WHAT THIS IS: the nginx vhost for the design origin (P77). Every published design
# build is served at the root of its own host, `d-<build>.sikstack.com`, by the
# `knowledge-design` container (server/design_serve.py, compose.prod.yml), so one
# build's script, localStorage and cookie never reach another build or the app. The
# box's `.env` names the same shape for the app and the api:
#
#     KB_DESIGN_ORIGIN=https://d-{build}.sikstack.com
#
# A build id is `b` and 25 base32 characters (server/design/store.py, new_build_id),
# so the host must match exactly that; anything else under *.sikstack.com matches no
# vhost here and falls to 00-default.conf (444, the connection is closed). The app
# reaches a build only through its viewer: sikstack.conf's `= /api/design/open` mints a
# one-minute ticket and redirects here, to `/_open?t=…`; knowledge-design trades it
# for its own host-only cookie and checks membership against the database on every
# request. The vhost proxies everything to it and decides nothing: the Host header is
# passed unchanged, because knowledge-design matches it against KB_DESIGN_ORIGIN.
#
# WHERE IT LANDS: /home/opc/edge/conf.d/sikstack-design.conf on the box, through the
# edge repo, by the operator, with the edge's own loop (./validate.sh -> bash stage.sh
# -> ./deploy.sh on the box; a graceful reload, never a recreate), together with
# sikstack.conf and before the redirect hosts. See deploy/README.md §3.
#
# HOUSE RULES — the conf.d/ tree is tested and reloaded AS A UNIT, so breaking one
# of these breaks EVERY site on the edge, not just this one:
#   * NEVER default_server. 00-default.conf owns the :80 and :443 catch-alls
#     (unknown Host -> 444). This vhost routes by Host/SNI only: its regex
#     server_name matches the SNI too, so TLS for a design host uses the pair below.
#   * NO IPv6 `listen [::]:...`. No sibling conf listens on v6, so adding it here
#     would silently make THIS vhost the default server for all v6 traffic.
#   * NO limit_req_zone and NO map: both live in the http context, and a duplicate
#     name is a hard `nginx -t` failure for every site.
#
# The server_name is QUOTED because its regex holds `{25}`: unquoted, nginx reads the
# brace as the start of a block. The named capture `build` is set per request only;
# nothing else in conf.d/ uses `$build`.

# =====================================================================
# :80 — to HTTPS on the same design host. A server-level `return` runs before
# location matching, so nothing else is needed here.
# =====================================================================
server {
    listen 80;
    server_name "~^d-(?<build>b[a-z2-7]{25})\.sikstack\.com$";

    return 301 https://$host$request_uri;
}

# =====================================================================
# :443 — the design origin.
# =====================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name "~^d-(?<build>b[a-z2-7]{25})\.sikstack\.com$";

    # TLS: the same Cloudflare Origin CA pair as sikstack.conf, SANs
    # `DNS:sikstack.com, DNS:*.sikstack.com`; the wildcard covers every d-<build> host
    # (one label deep, as Cloudflare's own edge certificate does).
    ssl_certificate     /etc/nginx/certs/sikstack.crt;
    ssl_certificate_key /etc/nginx/certs/sikstack.key;

    # Docker DNS re-resolution (LOAD-BEARING): the upstream is a container whose IP
    # changes on every recreate. 127.0.0.11 + a VARIABLE in proxy_pass re-resolves at
    # request time (valid=30s), so a knowledge-design recreate self-heals.
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $knowledge_design_upstream knowledge-design;

    # Cloudflare real-IP restore. The same list the sibling confs carry
    # (https://www.cloudflare.com/ips/); refresh them together, never one file alone.
    # IPv4:
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    # IPv6:
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # HSTS — house style: short max-age, NO preload.
    add_header Strict-Transport-Security "max-age=300" always;

    # knowledge-design answers GET and HEAD only, so no request carries a body worth
    # more than nginx's default cap; set it small and explicit.
    client_max_body_size 1m;

    # Shared proxy headers at server level (the HEADER-INHERITANCE FOOTGUN: a location
    # that sets any proxy_set_header of its own drops this whole set). Host is passed
    # as the browser sent it: knowledge-design finds the build id in it.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        # No URI part after the port: the original request URI passes through unchanged.
        proxy_pass http://$knowledge_design_upstream:8000;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
