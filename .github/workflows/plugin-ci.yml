name: plugin parity

# Root-only drift gate: the Feedback capture skill's served copy stays byte-identical to its
# canonical file (scripts/skills_parity.py). No mkdocs build here; no claude CLI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/skills_parity.py
